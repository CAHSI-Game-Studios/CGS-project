name: PR title

on:
  # Read PR metadata from the default branch, including PRs targeting gameA,
  # gameB, or stacked feature branches. No PR code is checked out or executed.
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  check-title:
    name: Issue number in PR title
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check original issue reference
        shell: python
        run: |
          import json
          import os
          import re
          import sys

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              title = json.load(event_file)["pull_request"]["title"]

          pattern = r"\[#[1-9][0-9]*(?:, #[1-9][0-9]*)*\] \S(?:[^\r\n]*\S)?"
          if not re.fullmatch(pattern, title):
              print(
                  "::error title=Missing original issue::"
                  "Use [#106] Original issue title. For multiple issues, use "
                  "[#122, #124] Short shared description."
              )
              sys.exit(1)

          print("PR title includes issue number(s) and a description.")
